<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · Finaxis</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234d6bff'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='Arial'%3ER$_%3E%3C/text%3E%3C/svg%3E">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-card__brand">
      <div class="logo-dot">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 4h16v16H4z"/><path d="M4 9h16M4 15h16"/></svg>
      </div>
      <div>
        <h1>Finaxis</h1>
        <div class="text-muted" style="font-size:12px">Pessoal · Python &amp; FastAPI</div>
      </div>
    </div>

    <div class="form-error" id="form-error"></div>

    <form id="login-form" novalidate>
      <div class="field" style="margin-bottom:14px">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" class="input" placeholder="voce@email.com" autocomplete="email" required>
      </div>
      <div class="field" style="margin-bottom:20px">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" class="input" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button class="btn btn--block" type="submit" id="btn-login">Entrar</button>
    </form>

    <p class="login-link">Não tem conta? <a href="#" id="go-register">Cadastre-se</a></p>

    <form id="register-form" class="hidden" novalidate>
      <div class="field" style="margin-bottom:14px">
        <label for="r-name">Nome</label>
        <input type="text" id="r-name" name="name" class="input" placeholder="Seu nome" autocomplete="name" required>
      </div>
      <div class="field" style="margin-bottom:14px">
        <label for="r-email">E-mail</label>
        <input type="email" id="r-email" name="email" class="input" placeholder="voce@email.com" autocomplete="email" required>
      </div>
      <div class="field" style="margin-bottom:20px">
        <label for="r-password">Senha (mín. 6 caracteres)</label>
        <input type="password" id="r-password" name="password" class="input" placeholder="••••••••" autocomplete="new-password" required>
      </div>
      <button class="btn btn--block" type="submit" id="btn-register">Criar conta</button>
    </form>

    <p class="login-link" id="back-to-login" style="display:none"><a href="#">Já tenho conta — entrar</a></p>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const token = localStorage.getItem("scfp_token");
      if (token) {
        location.href = "/";
        return;
      }

      const loginForm = document.getElementById("login-form");
      const registerForm = document.getElementById("register-form");
      const errorBox = document.getElementById("form-error");
      const goRegister = document.getElementById("go-register");
      const backToLogin = document.getElementById("back-to-login");

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.add("show");
      }
      function clearError() { errorBox.classList.remove("show"); }

      goRegister.addEventListener("click", (e) => {
        e.preventDefault();
        loginForm.classList.add("hidden");
        registerForm.classList.remove("hidden");
        backToLogin.style.display = "block";
        clearError();
      });
      backToLogin.addEventListener("click", (e) => {
        e.preventDefault();
        registerForm.classList.add("hidden");
        loginForm.classList.remove("hidden");
        backToLogin.style.display = "none";
        clearError();
      });

      async function submit(url, payload) {
        try {
          const resp = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await resp.json().catch(() => ({}));
          if (!resp.ok) {
            let msg = "Não foi possível completar a operação";
            if (Array.isArray(data.detail)) msg = data.detail.join("; ");
            else if (data.detail) msg = data.detail;
            throw new Error(msg);
          }
          localStorage.setItem("scfp_token", data.access_token);
          localStorage.setItem("scfp_user", JSON.stringify(data.user));
          location.href = "/";
        } catch (err) {
          showError(err.message);
        }
      }

      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        clearError();
        const btn = document.getElementById("btn-login");
        btn.disabled = true;
        submit("/api/auth/login", { email: loginForm.email.value, password: loginForm.password.value })
          .finally(() => (btn.disabled = false));
      });

      registerForm.addEventListener("submit", (e) => {
        e.preventDefault();
        clearError();
        const btn = document.getElementById("btn-register");
        btn.disabled = true;
        submit("/api/auth/register", {
          name: registerForm.name.value,
          email: registerForm.email.value,
          password: registerForm.password.value,
        }).finally(() => (btn.disabled = false));
      });
    });
  </script>
</body>
</html>
