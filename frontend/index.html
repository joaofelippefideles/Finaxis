<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finaxis — Sistema de Controle Financeiro Pessoal</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234d6bff'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='Arial'%3ER$_%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar__brand">
        <div class="logo-dot">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 4h16v16H4z"/><path d="M4 9h16M4 15h16"/></svg>
        </div>
        <span>Finaxis</span>
      </div>

      <nav class="sidebar__nav">
        <div class="sidebar__section">Visão geral</div>
        <a class="sidebar__link" href="#/dashboard" data-route="dashboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
          Dashboard
        </a>
        <a class="sidebar__link" href="#/transactions" data-route="transactions">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
          Lançamentos
        </a>
        <a class="sidebar__link" href="#/transfers" data-route="transfers">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3L4 7l4 4"/><path d="M4 7h16"/><path d="M16 21l4-4-4-4"/><path d="M20 17H4"/></svg>
          Transferências
        </a>

        <div class="sidebar__section">Recursos</div>
        <a class="sidebar__link" href="#/accounts" data-route="accounts">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><path d="M1 10h22"/></svg>
          Contas
        </a>
        <a class="sidebar__link" href="#/cards" data-route="cards">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><path d="M7 15h4"/></svg>
          Cartões
        </a>
        <a class="sidebar__link" href="#/installments" data-route="installments">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          Parceladas
        </a>
        <a class="sidebar__link" href="#/payables" data-route="payables">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg>
          Contas a pagar
        </a>
        <a class="sidebar__link" href="#/receivables" data-route="receivables">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
          Contas a receber
        </a>
        <a class="sidebar__link" href="#/recurring" data-route="recurring">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          Recorrentes
        </a>

        <div class="sidebar__section">Planejamento</div>
        <a class="sidebar__link" href="#/budgets" data-route="budgets">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
          Orçamento
        </a>
        <a class="sidebar__link" href="#/reports" data-route="reports">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Relatórios
        </a>
        <a class="sidebar__link" href="#/categories" data-route="categories">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          Categorias
        </a>

        <div class="sidebar__section">Sistema</div>
        <a class="sidebar__link" href="#/settings" data-route="settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Configurações
        </a>
      </nav>

      <div class="sidebar__footer">
        <span id="side-foot-version">v1.0.0</span>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-toggle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="topbar__search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="top-search" type="text" placeholder="Buscar lançamentos... (Enter)">
        </div>
        <div class="topbar__actions">
          <div style="position:relative">
            <button class="icon-btn" id="notif-toggle">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              <span class="badge-count" id="notif-count" style="display:none"></span>
            </button>
            <div class="notif-panel" id="notif-panel"></div>
          </div>
          <div class="user-chip">
            <div class="user-chip__avatar" id="user-avatar">U</div>
            <div class="user-chip__info">
              <div class="u-name" id="user-name">Usuário</div>
              <div class="u-mail" id="user-mail">—</div>
            </div>
          </div>
          <button class="icon-btn" id="btn-logout" title="Sair">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </header>

      <main class="content">
        <div class="page-head">
          <div>
            <h1 id="page-title">Dashboard</h1>
            <p id="page-subtitle">Visão geral das suas finanças</p>
          </div>
        </div>
        <div id="view"></div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/feather-icons@4.29.2/dist/feather.min.js"></script>

  <script src="/assets/js/format.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>

  <script src="/assets/js/views/dashboard.js"></script>
  <script src="/assets/js/views/transactions.js"></script>
  <script src="/assets/js/views/transfers.js"></script>
  <script src="/assets/js/views/accounts.js"></script>
  <script src="/assets/js/views/cards.js"></script>
  <script src="/assets/js/views/installments.js"></script>
  <script src="/assets/js/views/payables.js"></script>
  <script src="/assets/js/views/receivables.js"></script>
  <script src="/assets/js/views/list_items.js"></script>
  <script src="/assets/js/views/recurring.js"></script>
  <script src="/assets/js/views/budgets.js"></script>
  <script src="/assets/js/views/reports.js"></script>
  <script src="/assets/js/views/categories.js"></script>
  <script src="/assets/js/views/settings.js"></script>
  <script src="/assets/js/views/search.js"></script>
  <script src="/assets/js/app.js"></script>
</body>
</html>
